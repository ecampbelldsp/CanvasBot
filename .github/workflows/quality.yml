name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.10"
          enable-cache: true
      - name: Install test dependencies
        run: uv sync --locked --extra dev
      - name: Test
        run: uv run pytest --cov=canvasbot --cov-report=term-missing
      - name: Lint
        run: uv run ruff check src tests app.py main.py
      - name: Check formatting
        run: uv run ruff format --check src tests app.py main.py
      - name: Type check
        run: uv run mypy src/canvasbot
